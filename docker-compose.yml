# One-command local/production-like run:   docker compose up --build
# Then open http://localhost:8080 and create an admin with:
#   docker compose exec backend node scripts/seedAdmin.js
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [ mongo ]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/campus_lost_found
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      EMAIL_USER: ${EMAIL_USER:?Set EMAIL_USER in .env}
      EMAIL_PASS: ${EMAIL_PASS:?Set EMAIL_PASS in .env}
      # Proxies between the internet and the API: 1 = just the bundled nginx; 2 = a TLS proxy (Caddy / host nginx) in front of it.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin User}
      SEED_ADMIN_COLLEGE_ID: ${SEED_ADMIN_COLLEGE_ID:-ADMIN}
    volumes:
      - uploads:/data/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [ backend ]
    ports:
      - "8080:80"

volumes:
  mongo-data:
  uploads:
