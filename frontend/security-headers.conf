# Included by EVERY location in nginx.conf that sets its own add_header.
# (nginx only inherits server-level add_header into a location that sets none,
# so without this include the document itself would be served WITHOUT these.)
#
# Sessions live in sessionStorage (one login per tab), so XSS must be hard: no
# inline or third-party scripts at all. If the API is hosted on another origin,
# add it to connect-src and img-src below.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
