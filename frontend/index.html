<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Campus Lost &amp; Found</title>
    <meta name="description" content="Report lost items, post what you found, and get belongings back to their owners on campus. Contact details stay private until both people agree." />
    <meta name="theme-color" content="#14213d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Campus Lost &amp; Found" />
    <meta property="og:description" content="Lost something on campus? Someone may already have found it." />
    <script>
      // Apply the saved (or system) theme before first paint so there is no
      // flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Campus Lost &amp; Found needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
